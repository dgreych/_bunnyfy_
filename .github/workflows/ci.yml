name: Verificação

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: bunnyfy-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-node20:
    name: Node 20
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Obter código
        uses: actions/checkout@v4

      - name: Configurar Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: npm

      - name: Instalar ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Instalar dependências
        run: npm ci

      - name: Verificar projeto
        run: npm run verify
